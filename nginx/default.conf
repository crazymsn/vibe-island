server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness probe for Docker / orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Always revalidate the entry page so a new image is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fonts, CSS and JS are versioned with ?v=N in index.html.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
    }

    # The installer image. nginx answers Range requests, so downloads can resume.
    location /downloads/ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
